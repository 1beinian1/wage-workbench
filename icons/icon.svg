<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF7ED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#F97316" flood-opacity="0.3"/>
    </filter>
    <filter id="inner" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#FFFFFF" flood-opacity="0.9"/>
    </filter>
  </defs>
  <!-- Rounded square background -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg)"/>
  <!-- Calendar card with claymorphism -->
  <rect x="96" y="120" width="320" height="280" rx="40" fill="url(#card)" stroke="#FFFFFF" stroke-width="4" filter="url(#shadow)"/>
  <!-- Calendar top bar -->
  <rect x="96" y="120" width="320" height="60" rx="40" fill="#FB923C"/>
  <rect x="96" y="150" width="320" height="30" fill="#FB923C"/>
  <!-- Calendar hooks -->
  <rect x="146" y="96" width="16" height="56" rx="8" fill="#F97316"/>
  <rect x="350" y="96" width="16" height="56" rx="8" fill="#F97316"/>
  <!-- ¥ symbol -->
  <text x="256" y="310" font-family="Fredoka, Arial, sans-serif" font-size="140" font-weight="700" fill="#F97316" text-anchor="middle" dominant-baseline="middle">¥</text>
  <!-- Decorative dots -->
  <circle cx="130" cy="365" r="6" fill="#A78BFA"/>
  <circle cx="160" cy="365" r="6" fill="#22D3EE"/>
  <circle cx="190" cy="365" r="6" fill="#34D399"/>
</svg>
